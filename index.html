    <!-- Fonts (Instrument Serif + JetBrains Mono) are self-hosted via

    <!-- Dev/preview-only Service Worker unregister + cache purger. -->
    <!-- CRITICAL: this must NEVER run on a real deployment, or the app permanently -->
    <!-- self-destructs its own offline cache on every load, which defeats the whole -->
    <!-- offline-first PWA requirement. Scoped to the same hosts main.tsx treats as dev/preview. -->
    <script>
      (function() {
        var isDevOrPreview =
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname.includes('run.app');

        if (isDevOrPreview && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            if (regs.length > 0) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  keys.forEach(function(k) { caches.delete(k); });
                });
              }
              if (navigator.serviceWorker.controller && !sessionStorage.getItem('__sw_cleansed__')) {
                sessionStorage.setItem('__sw_cleansed__', '1');
                window.location.reload();
              }
            }
          }).catch(function() {});
        }
      })();
    </script>

        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('[LinOpt Window Error]', e);
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length <= 1)) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#FAF7F5;font-family:monospace;">' +
            '<div style="max-width:540px;width:100%;background:#FFF0EB;border:2px solid #C04828;padding:20px;color:#C04828;">' +
            '<h3 style="margin:0 0 8px 0;font-weight:bold;font-size:16px;">Error de inicialización</h3>' +
            '<p style="margin:0 0 12px 0;font-size:12px;color:#1F1B19;">' + (e.message || 'Error al ejecutar módulos') + '</p>' +
            '<button onclick="sessionStorage.clear();if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c)})})};location.reload();" style="background:#C04828;color:#fff;border:none;padding:8px 14px;font-weight:bold;cursor:pointer;font-family:monospace;font-size:12px;">Limpiar Caché y Recargar</button>' +
            '</div></div>';
        }
      });
    </script>
